filter-by-commitish: true
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels:
    - 'major'
  minor:
    labels:
    - 'minor'
    - 'enhancement'
  patch:
    labels:
    - 'auto-update'
    - 'patch'
    - 'fix'
    - 'bugfix'
    - 'bug'
    - 'hotfix'
    - 'no-release'
  default: 'minor'

categories:
# Categories for the release labels the version-resolver above already
# understands: major = breaking, minor = feature, patch = fix. Previously
# `patch` was filed under Enhancements and `minor`/`major` matched nothing, so
# fixes read as enhancements, no Bug Fixes chapter appeared, and features were
# listed uncategorized at the top of the notes with no heading.
- title: '💥 Breaking Changes'
  labels:
  - 'major'
- title: '✨ Features'
  labels:
  - 'minor'
  - 'feature'
- title: '🚀 Enhancements'
  labels:
  - 'enhancement'
- title: '🐛 Bug Fixes'
  labels:
  - 'patch'
  - 'fix'
  - 'bugfix'
  - 'bug'
  - 'hotfix'
- title: '🤖 Automatic Updates'
  labels:
  - 'auto-update'

change-template: |
  <details>
    <summary>$TITLE @$AUTHOR (#$NUMBER)</summary>
  $BODY
  </details>
template: |
  $CHANGES
replacers:
# Remove irrelevant information from Renovate bot
- search: '/(?<=---\s)\s*^#.*(Renovate configuration|Configuration)(?:.|\n)*?This PR has been generated .*/gm'
  replace: ''
# Remove Renovate bot banner image
- search: '/\[!\[[^\]]*Renovate\][^\]]*\](\([^)]*\))?\s*\n+/gm'
  replace: ''
