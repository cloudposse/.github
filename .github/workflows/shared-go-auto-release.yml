name: "Shared go releaser"

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Overrides job runs-on setting (json-encoded list)"
        type: string
        required: false
        default: '["ubuntu-latest"]'
      prerelease:
        description: "Boolean indicating whether this release should be a prerelease"
        required: false
        default: false
        type: string
      draft:
        description: "Draft release"
        required: false
        default: false
        type: string
      publish:
        description: "Whether to publish a new release immediately"
        required: false
        default: false
        type: string
      summary-enabled:
        description: Enable github action summary.
        required: false
        default: true
        type: boolean
      format:
        description: "Artifcats format. Valid: 'tar.gz', 'tgz', 'tar.xz', 'txz', 'tar.zst', 'tar', 'gz', 'zip', 'binary'."
        required: false
        default: "zip"
        type: string
      environment:
        description: "Release environment that has secrets"
        type: string
        required: false
        default: 'release'

    outputs:
      id:
        description: The ID of the release that was created or updated.
        value: ${{ jobs.publish.outputs.id }}
      name:
        description: The name of the release
        value: ${{ jobs.publish.outputs.name }}
      tag_name:
        description: The name of the tag associated with the release.
        value: ${{ jobs.publish.outputs.tag_name }}
      body:
        description: The body of the drafted release.
        value: ${{ jobs.publish.outputs.body }}
      html_url:
        description: The URL users can navigate to in order to view the release
        value: ${{ jobs.publish.outputs.html_url }}
      upload_url:
        description: The URL for uploading assets to the release, which could be used by GitHub Actions for additional uses, for example the @actions/upload-release-asset GitHub Action.
        value: ${{ jobs.publish.outputs.upload_url }}
      major_version:
        description: The next major version number. For example, if the last tag or release was v1.2.3, the value would be v2.0.0.
        value: ${{ jobs.publish.outputs.major_version }}
      minor_version:
        description: The next minor version number. For example, if the last tag or release was v1.2.3, the value would be v1.3.0.
        value: ${{ jobs.publish.outputs.minor_version }}
      patch_version:
        description: The next patch version number. For example, if the last tag or release was v1.2.3, the value would be v1.2.4.
        value: ${{ jobs.publish.outputs.patch_version }}
      resolved_version:
        description: The next resolved version number, based on GitHub labels.
        value: ${{ jobs.publish.outputs.resolved_version }}
      exists:
        description: Tag exists so skip new release issue
        value: ${{ jobs.publish.outputs.exists }}

permissions:
  id-token: write
  contents: read

jobs:
  draft:
    uses: cloudposse/.github/.github/workflows/shared-auto-release.yml@main
    with:
      publish: false
      summary-enabled: false
      prerelease: ${{ inputs.prerelease }}
      environment: ${{ inputs.environment }}
    secrets: inherit

  goreleaser:
    if: ${{ needs.draft.outputs.exists == 'false' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    needs: [ draft ]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: github-app
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}

      - name: Install Git & GPG
        run: |-
          sudo apt-get update && sudo apt-get install -y git gnupg2

      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # syft binary that .goreleaser.yml's sboms: block shells out to.
      - name: "Install syft"
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          token: ${{ steps.github-app.outputs.token }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Unshallow
        working-directory: source
        run: |-
          git fetch --prune --unshallow          
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"          
          git tag -a -m "Release ${{ needs.draft.outputs.tag_name }}" ${{ needs.draft.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Check disk space before
        shell: bash
        working-directory: source
        run: |-
          printf "\nPWD is %s\ndf -h %s\n\n" "$(pwd -P)" "$(pwd -P)"
          df -h $(pwd -P)
          if [[ -n $TMPDIR ]]; then
            printf "\n\nTMPDIR set to %s\ndf -h %s\n\n" "$TMPDIR" "$TMPDIR"
            df -h "$TMPDIR"
          else 
            printf "\n\nTMPDIR not set, showing space in /tmp\n\n"
            df -h /tmp
          fi
          printf "\n\nAll disk space:\n"
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .configs
          sparse-checkout: |
            .github/goreleaser.yml
          sparse-checkout-cone-mode: false
          ref: main
          token: ${{ steps.github-app.outputs.token }}

      - name: Go releaser config
        working-directory: source
        id: go-releaser-config
        run: |-
          if [ -f .goreleaser.yml ]; then
            echo 'Go releaser config exists.'
            mkdir -p ../.configs/repo/
            cp ./.goreleaser.yml ../.configs/repo/.goreleaser.yml
            GORELEASER_CONFIG="../.configs/repo/.goreleaser.yml"            
          else
            echo 'Go releaser config does not exist. Use org wide config'
            GORELEASER_CONFIG="../.configs/.github/goreleaser.yml"
          fi

          if [[ "${{ inputs.draft }}" == "true" && -f .goreleaser.draft.yml ]]; then
            echo 'Go releaser draft config exists and this is draft mode'
            mkdir -p ../.configs/repo/
            cp ./.goreleaser.draft.yml ../.configs/repo/.goreleaser.draft.yml
            GORELEASER_CONFIG="../.configs/repo/.goreleaser.draft.yml"
          fi
          

          if [[ "${{ inputs.format }}" == "binary" ]]; then
            sed -i 's/{{ .Env.ARCHIVES_FORMAT }}/binary/g' $GORELEASER_CONFIG
          elif [[ "${{ inputs.format }}" == "zip" ]]; then
            sed -i 's/{{ .Env.ARCHIVES_FORMAT }}/zip/g' $GORELEASER_CONFIG
          fi

          echo "path=./${GORELEASER_CONFIG}" >> $GITHUB_OUTPUT

      - name: Check disk space before cleanup
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |-
          printf "\nPWD is %s\ndf -h %s\n\n" "$(pwd -P)" "$(pwd -P)"
          df -h $(pwd -P)
          if [[ -n $TMPDIR ]]; then
            printf "\n\nTMPDIR set to %s\ndf -h %s\n\n" "$TMPDIR" "$TMPDIR"
            df -h "$TMPDIR"
          else 
            printf "\n\nTMPDIR not set, showing space in /tmp\n\n"
            df -h /tmp
          fi
          printf "\n\nAll disk space:\n"
          df -h

      - name: Free space
        run: |
          sudo apt-get remove -y '^dotnet-.*'
          sudo apt-get remove -y '^llvm-.*'
          sudo apt-get remove -y 'php.*'
          sudo apt-get remove -y google-chrome-stable firefox powershell mono-devel
          sudo apt-get autoremove -y
          sudo apt-get clean
          rm -rf /usr/share/dotnet/

      - name: Check disk space after cleanup
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |-
          printf "\nPWD is %s\ndf -h %s\n\n" "$(pwd -P)" "$(pwd -P)"
          df -h $(pwd -P)
          if [[ -n $TMPDIR ]]; then
            printf "\n\nTMPDIR set to %s\ndf -h %s\n\n" "$TMPDIR" "$TMPDIR"
            df -h "$TMPDIR"
          else 
            printf "\n\nTMPDIR not set, showing space in /tmp\n\n"
            df -h /tmp
          fi
          printf "\n\nAll disk space:\n"
          df -h


      # Re-minted immediately before the long-running goreleaser invocation:
      # GitHub App installation tokens are hard-capped at 1 hour (not
      # configurable), and the goreleaser step below (build + sign + SBOM +
      # publish, across every platform target) has been taking 45-65+
      # minutes on its own and trending upward. The original `github-app`
      # token from the top of this job has already burned several minutes on
      # setup (git/gpg install, harden-runner init, syft install, checkout,
      # unshallow, go setup, gpg import, disk-space checks, apt cleanup)
      # before goreleaser even starts, so by the time goreleaser reaches its
      # final publish-phase API calls (listing/deleting existing drafts) the
      # original token can already be expired, failing with a `401 Bad
      # credentials` that has nothing to do with the release content itself.
      # Minting a fresh token right here maximizes the runway goreleaser gets
      # before its own token goes stale.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: github-app-release
        with:
          app-id: ${{ vars.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: releaser
        with:
          workdir: source
          version: latest
          args: release --config ${{ steps.go-releaser-config.outputs.path }} --clean --timeout 180m
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ steps.github-app-release.outputs.token }}
          GO_RELEASER_TARGET_COMMITISH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          GO_RELEASER_DRAFT_MODE: ${{ inputs.draft }}

      # Real Sigstore-backed provenance for every binary this job just built
      # locally — no longer a re-fetch, so this is genuine build-time
      # GitHub-native attestation stacked on top of cosign (a different
      # verification mechanism/consumer than cosign, e.g. `gh attestation
      # verify`), not a second re-fetch-and-sign layer.
      - name: "Attest build provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          github-token: ${{ steps.github-app-release.outputs.token }}
          subject-path: 'source/dist/*'

      - name: "Resolve checksums file"
        id: checksums
        run: |
          file="$(find source/dist -maxdepth 1 -name '*_SHA256SUMS' -print -quit)"
          if [ -z "$file" ]; then
            echo "No *_SHA256SUMS file found in dist/" >&2
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Bind a source-tree SBOM to the checksums file — it already commits to
      # every binary's exact digest, so it's a well-defined single-artifact
      # anchor for a release that ships multiple platform binaries. Separate
      # from .goreleaser.yml's per-archive sboms: block (bound to individual
      # archives, uploaded to the release directly by GoReleaser itself).
      # - name: "Generate and attest source-tree SBOM"
      #   uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      #   with:
      #     github-token: ${{ steps.github-app.outputs.token }}
      #     path: source/
      #     format: spdx-json
      #     output-file: source/dist/atmos-sbom.spdx.json
      #     # We upload the SBOM to the GitHub release ourselves in the next
      #     # step, so skip the action's own GH Actions workflow-artifact
      #     # upload — it depends on the runner's internal artifact-caching
      #     # proxy, which has been unreliable on our self-hosted runners.
      #     upload-artifact: false

      # - name: "Attest SBOM"
      #   uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      #   with:
      #     github-token: ${{ steps.github-app.outputs.token }}
      #     subject-path: source/
      #     sbom-path: source/dist/atmos-sbom.spdx.json

      # - name: "Upload source-tree SBOM to the release"
      #   env:
      #     GITHUB_TOKEN: ${{ steps.github-app.outputs.token }}
      #     TAG: ${{ fromJSON(steps.releaser.outputs.metadata).tag }}
      #   run: |
      #     gh release upload "$TAG" source/dist/atmos-sbom.spdx.json \
      #       --repo "${{ github.repository }}" --clobber

      - name: Check disk space after
        if: success() || failure()
        shell: bash
        working-directory: source
        run: |-
          printf "\nPWD is %s\ndf -h %s\n\n" "$(pwd -P)" "$(pwd -P)"
          df -h $(pwd -P)
          if [[ -n $TMPDIR ]]; then
            printf "\n\nTMPDIR set to %s\ndf -h %s\n\n" "$TMPDIR" "$TMPDIR"
            df -h "$TMPDIR"
          else 
            printf "\n\nTMPDIR not set, showing space in /tmp\n\n"
            df -h /tmp
          fi
          printf "\n\nAll disk space:\n"
          df -h

  publish:
    if: ${{ needs.draft.outputs.exists == 'false' }}
    needs: [ goreleaser, draft ]
    uses: cloudposse/.github/.github/workflows/shared-auto-release.yml@main
    with:
      publish: ${{ inputs.publish }}
      prerelease: ${{ inputs.prerelease }}
      summary-enabled: ${{ inputs.summary-enabled }}
      environment: ${{ inputs.environment }}
    secrets: inherit
