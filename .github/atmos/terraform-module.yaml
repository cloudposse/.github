docs:
  generate:
    readme:
      base-dir: .
      input:
        - "./README.yaml"
        - get_support: true        
      template: "https://raw.githubusercontent.com/cloudposse/.github/refs/heads/main/README.md.gotmpl"
      output: "./README.md"
      terraform:
        source: .
        enabled: true
        format: "markdown table"
        show_providers: false
        show_inputs: true
        show_outputs: true
        sort_by: "name"
        hide_empty: false
        indent_level: 2

# Test wiring: the module's `examples/complete` is the Atmos component under test, run against an
# emulator. Per-module stack manifests live in tests/stacks (catalog/emulator.yaml is managed by the
# scaffold; deploy/test.yaml holds the example's inputs and is owned by the module).
components:
  terraform:
    command: tofu
    base_path: examples
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: false

stacks:
  base_path: tests/stacks
  included_paths:
    - "deploy/**/*"
  name_template: "{{ .vars.stage }}"

# One identity binds the example to the emulator (no providers.tf needed). Pinned to the `test`
# stack's instance so another running emulator on the same machine cannot make it ambiguous.
auth:
  identities:
    local-aws:
      kind: aws/emulator
      emulator: test/aws
      default: true

ci:
  enabled: true
  summary:
    enabled: true
  output:
    enabled: true
  annotations:
    enabled: true

commands:
- name: readme
  steps:
    - "atmos docs generate readme"

- name: lint
  description: Check Terraform formatting, run TFLint, check provider constraints, validate and lint the GitHub Actions workflows (`atmos ci validate`) (replaces the bats lint, pinning and description checks)
  dependencies:
    tools:
      opentofu: "1.12.5"
      tflint: "0.59.1"
  steps:
    - "tofu fmt -check -recursive -diff"
    # GitHub Actions workflows (native actionlint integration): syntax, expressions, shell, reusable-workflow inputs.
    - "atmos ci validate"
    - |
      # Use the module's own .tflint.hcl if it has one, else the shared Cloud Posse policy.
      CONFIG="$PWD/.tflint.hcl"
      if [ ! -f "$CONFIG" ]; then
        CONFIG="$(mktemp)"
        curl -fsSL https://raw.githubusercontent.com/cloudposse/.github/refs/heads/main/.github/tflint/.tflint.hcl -o "$CONFIG"
      fi
      tflint --config "$CONFIG" --recursive
    - |
      # Provider constraints in versions.tf must use >= only (no ~>, <, =, != or bare versions).
      if find . -name versions.tf -not -path '*/.terraform/*' -print0 | xargs -0 grep -nE '^[[:space:]]*version[[:space:]]*=[[:space:]]*"(~>|<|=|!=|[0-9])'; then
        echo "versions.tf: constrain providers with >= only" >&2
        exit 1
      fi
    - |
      # Validate every directory that contains Terraform files (module root and examples).
      status=0
      for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
        (cd "$dir" && tofu init -backend=false -input=false >/dev/null && tofu validate) || status=1
      done
      exit $status

- name: deprecations
  description: Find and fix deprecated Terraform syntax with TFLint (legacy splat, interpolation-only, two-argument lookup)
  commands:
  - name: check
    description: Report deprecated syntax; exits non-zero if any is found
    dependencies:
      tools:
        tflint: "0.59.1"
    steps:
      - "tflint --only terraform_deprecated_index --only terraform_deprecated_interpolation --only terraform_deprecated_lookup --recursive"

  - name: fix
    description: Automatically rewrite deprecated syntax in place
    dependencies:
      tools:
        tflint: "0.59.1"
    steps:
      - "tflint --only terraform_deprecated_index --only terraform_deprecated_interpolation --only terraform_deprecated_lookup --recursive --fix"

- name: fix
  description: Apply every automatic fix (deprecated syntax, unused declarations, formatting, README). Removing unused variables changes the module interface, so only run this as part of a major release and review the diff.
  dependencies:
    tools:
      opentofu: "1.12.5"
      tflint: "0.59.1"
  steps:
    # Managed files (workflows, AGENTS.md, CODEOWNERS, settings, dependabot, context.tf, emulator stack). Fully overwritten.
    - "atmos scaffold generate github.com/cloudposse/.github//.github/scaffolds/terraform-module . --ref main --update --merge-strategy=theirs --merge-driver=text --defaults --skip-hooks"
    - "tflint --only terraform_deprecated_index --only terraform_deprecated_interpolation --only terraform_deprecated_lookup --only terraform_unused_declarations --recursive --fix"
    - "tofu fmt -recursive"
    - "atmos docs generate readme"

- name: test
  description: Run the module's tests. Unit tests (`tests/*.tftest.hcl`, mocked provider) run offline; then `examples/complete` is applied and asserted against an AWS emulator (started and stopped by hooks in `tests/stacks`).
  dependencies:
    tools:
      opentofu: "1.12.5"
  steps:
    - "tofu init -backend=false -input=false"
    - "tofu test"
    - "atmos validate stacks"
    - "atmos terraform test complete -s test"

settings:
  telemetry:
    enabled: false
