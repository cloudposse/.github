docs:
  generate:
    readme:
      base-dir: .
      input:
        - "./README.yaml"
        - get_support: true        
      template: "https://raw.githubusercontent.com/cloudposse/.github/refs/heads/main/README.md.gotmpl"
      output: "./README.md"
      terraform:
        source: .
        enabled: true
        format: "markdown table"
        show_providers: false
        show_inputs: true
        show_outputs: true
        sort_by: "name"
        hide_empty: false
        indent_level: 2

commands:
- name: readme
  steps:
    - "atmos docs generate readme"

- name: lint
  description: Check Terraform formatting and run TFLint (replaces the bats lint, pinning and description checks)
  dependencies:
    tools:
      terraform: "1.10.3"
      tflint: "0.59.1"
  steps:
    - "terraform fmt -check -recursive -diff"
    - |
      # Use the module's own .tflint.hcl if it has one, else the shared Cloud Posse policy.
      CONFIG=.tflint.hcl
      if [ ! -f "$CONFIG" ]; then
        CONFIG="$(mktemp)"
        curl -fsSL https://raw.githubusercontent.com/cloudposse/.github/refs/heads/main/.github/tflint/.tflint.hcl -o "$CONFIG"
      fi
      tflint --config "$CONFIG" --recursive

- name: deprecations
  description: Find and fix deprecated Terraform syntax with TFLint (legacy splat, interpolation-only, two-argument lookup)
  commands:
  - name: check
    description: Report deprecated syntax; exits non-zero if any is found
    dependencies:
      tools:
        tflint: "0.59.1"
    steps:
      - "tflint --only terraform_deprecated_index --only terraform_deprecated_interpolation --only terraform_deprecated_lookup --recursive"

  - name: fix
    description: Automatically rewrite deprecated syntax in place
    dependencies:
      tools:
        tflint: "0.59.1"
    steps:
      - "tflint --only terraform_deprecated_index --only terraform_deprecated_interpolation --only terraform_deprecated_lookup --recursive --fix"

- name: test
  commands:
  - name: "init"
    description: Initialize tests
    steps:
      - "make -C test/src init"

  - name: "run"
    description: Run tests
    steps:
      - "cd test/src && go mod tidy"
      - "cd test/src && go test -v -timeout 60m"

  - name: "clean"
    description: Clean tests
    steps:
      - "make -C test/src clean"
      - "rm -rf examples/*/.terraform examples/*/.terraform.lock.hcl"

settings:
  telemetry:
    enabled: false
